<!doctype html>
<html lang="en">
<head>

  <title>Exercise 4.1 — SVG House</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;

    <rect x="85" y="255" width="22" height="118" fill="sienna" />

    <rect x="181" y="235" width="43" height="42" fill="lightblue" />

    <path d="M245 525 C220 490, 145 460, 150 425 C155 395, 210 380, 260 373"

</body>
</html>
