<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">SVG coordinate annotations</title>
  <desc id="desc">A screenshot of the garden cottage marked with examples of eight SVG elements and their coordinates.</desc>
  <rect width="1440" height="760" fill="#f5f5ef" />
  <text x="24" y="40" font-family="Arial" font-size="28" font-weight="700" fill="#19352f">SVG coordinate map · 960 × 620 viewBox</text>
  <image x="20" y="60" width="960" height="620" xlink:href="house.png" />
  <rect x="20" y="60" width="960" height="620" rx="12" fill="none" stroke="#8aa89a" stroke-width="2" />

  <g font-family="Arial" font-size="19" font-weight="700" text-anchor="middle">
    <g><circle cx="42" cy="82" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="42" y="89" fill="#175f54">A</text></g>
    <g><circle cx="806" cy="168" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="806" y="175" fill="#175f54">B</text></g>
    <g><circle cx="171" cy="162" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="171" y="169" fill="#175f54">C</text></g>
    <g><circle cx="465" cy="230" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="465" y="237" fill="#175f54">D</text></g>
    <g><circle cx="350" cy="422" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="350" y="429" fill="#175f54">E</text></g>
    <g><circle cx="501" cy="578" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="501" y="585" fill="#175f54">F</text></g>
    <g><circle cx="88" cy="625" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="88" y="632" fill="#175f54">G</text></g>
    <g><circle cx="622" cy="422" r="17" fill="#ffffff" stroke="#175f54" stroke-width="3"/><text x="622" y="429" fill="#175f54">H</text></g>
  </g>

  <g font-family="Arial" fill="#19352f">
    <text x="1010" y="92" font-size="24" font-weight="700">Code → drawing</text>
    <text x="1010" y="132" font-size="18">A · rect: sky starts at (0, 0)</text>
    <text x="1010" y="162" font-size="16" fill="#48645c">width 960, height 620</text>
    <text x="1010" y="208" font-size="18">B · circle: sun centre (786, 108)</text>
    <text x="1010" y="238" font-size="16" fill="#48645c">radius 48</text>
    <text x="1010" y="284" font-size="18">C · ellipse: cloud centre (151, 102)</text>
    <text x="1010" y="314" font-size="16" fill="#48645c">horizontal radius 78, vertical radius 23</text>
    <text x="1010" y="360" font-size="18">D · polygon: roof corners</text>
    <text x="1010" y="390" font-size="16" fill="#48645c">(210, 290), (445, 145), (680, 290)</text>
    <text x="1010" y="436" font-size="18">E · line: left window divider</text>
    <text x="1010" y="466" font-size="16" fill="#48645c">(330, 326) to (330, 392)</text>
    <text x="1010" y="512" font-size="18">F · path: walkway starts at (452, 482)</text>
    <text x="1010" y="558" font-size="18">G · text: baseline at (48, 566)</text>
    <text x="1010" y="604" font-size="18">H · group: right window moved by</text>
    <text x="1010" y="634" font-size="16" fill="#48645c">translate(523, 326)</text>
  </g>
  <text x="24" y="725" font-family="Arial" font-size="17" fill="#48645c">SVG coordinates begin at the top left; x grows right, y grows down. Group transforms shift child coordinates.</text>
</svg>
